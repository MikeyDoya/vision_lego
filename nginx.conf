# Vision Lego — HTTP only (no domain yet, accessed via droplet IP)
# Copy to: /etc/nginx/sites-available/vision_lego
# Enable: sudo ln -s /etc/nginx/sites-available/vision_lego /etc/nginx/sites-enabled/
# Disable default site first: sudo rm -f /etc/nginx/sites-enabled/default
# Test + reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5M;

    # Serve uploaded product images directly from disk (persists across deploys)
    location /uploads/ {
        alias /home/mikey/vision_lego/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # All other requests proxied to the Node.js app
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
