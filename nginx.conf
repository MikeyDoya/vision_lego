# Vision Lego — Nginx reverse proxy
#
# IMPORTANT: The live server config is managed by Certbot at
#             /etc/nginx/conf.d/vision_lego.conf
#             Do NOT edit it manually — Certbot rewrites it on every cert renewal.
#             This repo copy is for DOCUMENTATION and fresh-droplet rebuilds ONLY.
#             It is NOT deployed by CI/CD.
#
# Fresh-droplet rebuild (HTTP-first; certbot --nginx adds the TLS blocks):
#   1. Copy:          sudo cp nginx.conf /etc/nginx/conf.d/vision_lego.conf
#   2. Test + reload: sudo nginx -t && sudo systemctl reload nginx
#   3. Obtain cert:   sudo certbot --nginx -d visionlego.com -d www.visionlego.com
#      Certbot rewrites the config to add the 443 server block and 301 redirect.
#   4. Home dir perm: sudo chmod o+x /home/mikey
#      (Ubuntu 24 creates home dirs at 0750; Nginx needs +x to serve /uploads/)

server {
    listen 80;
    server_name visionlego.com www.visionlego.com;

    client_max_body_size 5M;

    # Serve uploaded product images directly from disk (persists across deploys)
    location /uploads/ {
        alias /home/mikey/vision_lego/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # All other requests proxied to the Node.js app
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
