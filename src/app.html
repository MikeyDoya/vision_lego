<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				var t = localStorage.getItem('theme');
				var sys = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (t === 'dark' || (!t && sys)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>

		<!-- Favicons -->
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#FF5800" />

		<!-- Open Graph / social previews -->
		<!-- TODO: replace PUBLIC_BASE_URL with the real https://domain (or http://DROPLET_IP) once a public URL exists. og:image and twitter:image require an absolute URL. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Visión Lego" />
		<meta property="og:title" content="Visión Lego — Gafas de Sol y Monturas Ópticas" />
		<meta property="og:description" content="Gafas que enamoran. Tendencia, calidad premium, precios reales y estilo en cada colección." />
		<meta property="og:image" content="PUBLIC_BASE_URL/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Visión Lego — Gafas de Sol y Monturas Ópticas" />
		<meta name="twitter:description" content="Gafas que enamoran. Tendencia, calidad premium, precios reales y estilo en cada colección." />
		<meta name="twitter:image" content="PUBLIC_BASE_URL/og-image.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
